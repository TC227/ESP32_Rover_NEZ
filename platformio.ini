; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; BLE + Classic SPP fill the default 1.25 MB app slot. huge_app gives 3 MB (no OTA, NVS unchanged).
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<BaseNtripCaster.cpp> -<RoverBaseLink.cpp>
; One firmware: BLE name E25aer_gnss. App sends $ROLE,BASE or $ROLE,ROVER after connect.
; Base then streams RTCM on HC-12 433 MHz; rover takes HC-12 or phone NTRIP.

; Same binary as esp32dev — kept so older upload scripts still work.
[env:esp32dev_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<BaseNtripCaster.cpp> -<RoverBaseLink.cpp>
